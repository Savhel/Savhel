<svg width="1400" height="520" viewBox="0 0 1400 520" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="520">
    <stop stop-color="#0B1020"/>
    <stop offset="1" stop-color="#101A35"/>
  </linearGradient>
  <style>
    .box{fill:#0F172A;stroke:rgba(255,255,255,.10);}
    .title{fill:#fff;font-family:Inter,Segoe UI,Arial,sans-serif;font-size:22px;font-weight:800;}
    .txt{fill:#CBD5E1;font-family:Inter,Segoe UI,Arial,sans-serif;font-size:16px;}
  </style>
</defs>
<rect width="1400" height="520" rx="26" fill="url(#bg)"/>
<text x="60" y="58" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800">Research areas</text>
<text x="60" y="86" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">A more visual summary of the spaces I explore.</text>

