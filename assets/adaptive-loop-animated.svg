<svg width="1440" height="430" viewBox="0 0 1440 430" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="430">
    <stop stop-color="#08111F"/>
    <stop offset="1" stop-color="#101A35"/>
  </linearGradient>
  <linearGradient id="control" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#0EA5E9"/>
    <stop offset=".5" stop-color="#3B82F6"/>
    <stop offset="1" stop-color="#8B5CF6"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .h{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:800;fill:#F8FAFC}
    .s{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#CBD5E1}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#94A3B8}
    .node{fill:#0F172A;stroke:rgba(255,255,255,.12)}
    .layer{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:700;fill:#93C5FD;font-size:13px;letter-spacing:1.8px}
  </style>
</defs>

<rect width="1440" height="430" rx="28" fill="url(#bg)"/>
<rect x="1.5" y="1.5" width="1437" height="427" rx="26.5" stroke="#FFFFFF" stroke-opacity=".06"/>

<text x="70" y="58" class="h" font-size="31">Closed-loop Intelligent Systems Architecture</text>
<text x="70" y="88" class="s" font-size="17">A control-oriented view of adaptive infrastructure: observe, infer, decide, execute, verify.</text>

<text x="95" y="136" class="layer">OBSERVABILITY</text>
<text x="390" y="136" class="layer">STATE &amp; INFERENCE</text>
<text x="710" y="136" class="layer">POLICY &amp; CONTROL</text>
<text x="1045" y="136" class="layer">EXECUTION</text>

<g>
  <rect x="70" y="160" width="250" height="110" rx="18" class="node"/>
  <circle cx="103" cy="193" r="8" fill="#22D3EE"/>
  <text x="125" y="199" class="h" font-size="22">Telemetry Plane</text>
  <text x="102" y="228" class="s" font-size="14">metrics • events • sensors • traces</text>
  <text x="102" y="250" class="m" font-size="12">CPU / RAM / GPU / I/O / network</text>

  <rect x="375" y="160" width="270" height="110" rx="18" class="node"/>
  <circle cx="408" cy="193" r="8" fill="#38BDF8"/>
  <text x="430" y="199" class="h" font-size="22">State Estimator</text>
  <text x="407" y="228" class="s" font-size="14">normalization • models • prediction</text>
  <text x="407" y="250" class="m" font-size="12">ML / rules / confidence / anomaly state</text>

  <rect x="700" y="160" width="285" height="110" rx="18" class="node"/>
  <circle cx="733" cy="193" r="8" fill="#818CF8"/>
  <text x="755" y="199" class="h" font-size="22">Policy Engine</text>
  <text x="732" y="228" class="s" font-size="14">constraints • priorities • planning</text>
  <text x="732" y="250" class="m" font-size="12">placement / quotas / scheduling / failover</text>

  <rect x="1040" y="160" width="330" height="110" rx="18" class="node"/>
  <circle cx="1073" cy="193" r="8" fill="#A78BFA"/>
  <text x="1095" y="199" class="h" font-size="22">Orchestration Layer</text>
  <text x="1072" y="228" class="s" font-size="14">migrate • scale • isolate • allocate</text>
  <text x="1072" y="250" class="m" font-size="12">VMs / containers / GPU jobs / storage</text>
</g>

<g stroke="url(#control)" stroke-width="3" stroke-linecap="round">
  <path d="M320 215H375"/>
  <path d="M645 215H700"/>
  <path d="M985 215H1040"/>
</g>
<g fill="#60A5FA">
  <path d="M367 210L377 215L367 220Z"/>
  <path d="M692 210L702 215L692 220Z"/>
  <path d="M1032 210L1042 215L1032 220Z"/>
</g>

<circle r="5.5" fill="#22D3EE" filter="url(#glow)">
  <animateMotion dur="5.8s" repeatCount="indefinite" path="M320 215H375 645 700 985 1040"/>
</circle>

<path d="M1205 270V332H195V270" stroke="#60A5FA" stroke-opacity=".45" stroke-width="2.2" stroke-dasharray="9 10" fill="none"/>
<path d="M195 270L190 280H200Z" fill="#60A5FA" opacity=".7"/>
<text x="700" y="360" text-anchor="middle" class="m" font-size="13">feedback: outcome verification • policy evaluation • continuous adaptation</text>

<circle r="4.8" fill="#A855F7" filter="url(#glow)">
  <animateMotion dur="8s" repeatCount="indefinite" path="M1205 270V332H195V270"/>
</circle>

<rect x="70" y="385" width="1300" height="1" fill="#FFFFFF" opacity=".08"/>
<text x="70" y="410" class="m" font-size="12">DESIGN PRINCIPLES</text>
<text x="210" y="410" class="s" font-size="13">observability by default</text>
<text x="405" y="410" class="s" font-size="13">constraint-aware decisions</text>
<text x="625" y="410" class="s" font-size="13">measurable actions</text>
<text x="790" y="410" class="s" font-size="13">safe rollback</text>
<text x="910" y="410" class="s" font-size="13">explainable policies</text>
<text x="1070" y="410" class="s" font-size="13">continuous feedback</text>
</svg>