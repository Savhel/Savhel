<svg width="1440" height="760" viewBox="0 0 1440 760" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="760">
    <stop stop-color="#08111F"/>
    <stop offset="1" stop-color="#111E3E"/>
  </linearGradient>
  <radialGradient id="core" cx="0" cy="0" r="1" gradientTransform="translate(720 382) rotate(90) scale(170)">
    <stop stop-color="#2563EB"/>
    <stop offset=".62" stop-color="#4338CA"/>
    <stop offset="1" stop-color="#6D28D9"/>
  </radialGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity=".32"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .h{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:800;fill:#F8FAFC}
    .s{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#CBD5E1}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#94A3B8}
  </style>
</defs>
<rect width="1440" height="760" rx="30" fill="url(#bg)"/>

<text x="70" y="64" class="h" font-size="34">Engineering Orbit</text>
<text x="70" y="95" class="s" font-size="18">A visual map of the domains I connect.</text>

<!-- orbit lines -->
<g fill="none" stroke="#60A5FA" stroke-opacity=".18" stroke-width="2">
  <ellipse cx="720" cy="390" rx="505" ry="228"/>
  <ellipse cx="720" cy="390" rx="390" ry="175"/>
  <ellipse cx="720" cy="390" rx="285" ry="128"/>
</g>

<!-- core -->
<g filter="url(#shadow)">
  <circle cx="720" cy="390" r="128" fill="url(#core)"/>
</g>
<circle cx="720" cy="390" r="145" fill="none" stroke="#A5B4FC" stroke-opacity=".26" stroke-width="2">
  <animate attributeName="r" values="140;158;140" dur="5s" repeatCount="indefinite"/>
  <animate attributeName="stroke-opacity" values=".16;.40;.16" dur="5s" repeatCount="indefinite"/>
</circle>
<text x="720" y="372" text-anchor="middle" class="h" font-size="28">INTELLIGENT</text>
<text x="720" y="408" text-anchor="middle" class="h" font-size="28">COMPUTING</text>
<text x="720" y="444" text-anchor="middle" class="h" font-size="28">SYSTEMS</text>

<!-- nodes -->
<g filter="url(#shadow)">
  <rect x="145" y="225" width="250" height="120" rx="24" fill="#0F172A" stroke="#22D3EE" stroke-opacity=".40"/>
  <text x="175" y="271" class="h" font-size="23">Distributed Systems</text>
  <text x="175" y="304" class="s" font-size="16">Kafka • Cassandra • Redis</text>
  <text x="175" y="328" class="m" font-size="13">events • coordination • scale</text>

  <rect x="1045" y="225" width="250" height="120" rx="24" fill="#0F172A" stroke="#3B82F6" stroke-opacity=".40"/>
  <text x="1075" y="271" class="h" font-size="23">Cloud & Virtualization</text>
  <text x="1075" y="304" class="s" font-size="16">Proxmox • Xen • Ceph</text>
  <text x="1075" y="328" class="m" font-size="13">placement • migration • HA</text>

  <rect x="120" y="495" width="280" height="125" rx="24" fill="#0F172A" stroke="#14B8A6" stroke-opacity=".40"/>
  <text x="150" y="542" class="h" font-size="23">IoT & Intelligent Sensing</text>
  <text x="150" y="575" class="s" font-size="16">ESP32 • IMU • filtering</text>
  <text x="150" y="599" class="m" font-size="13">wearables • sensor fusion</text>

  <rect x="1015" y="495" width="300" height="125" rx="24" fill="#0F172A" stroke="#A855F7" stroke-opacity=".40"/>
  <text x="1045" y="542" class="h" font-size="23">AI / ML / DL / XAI</text>
  <text x="1045" y="575" class="s" font-size="16">prediction • explanation • control</text>
  <text x="1045" y="599" class="m" font-size="13">NLP • radar • adaptive systems</text>

  <rect x="570" y="610" width="300" height="110" rx="24" fill="#0F172A" stroke="#F59E0B" stroke-opacity=".40"/>
  <text x="600" y="653" class="h" font-size="23">Operating Systems</text>
  <text x="600" y="685" class="s" font-size="16">scheduling • memory • concurrency</text>

  <rect x="570" y="125" width="300" height="110" rx="24" fill="#0F172A" stroke="#06B6D4" stroke-opacity=".40"/>
  <text x="600" y="168" class="h" font-size="23">Intelligent Infrastructure</text>
  <text x="600" y="200" class="s" font-size="16">GPUaaS • agents • adaptive control</text>
</g>

<!-- moving orbit particles -->
<circle r="7" fill="#22D3EE" filter="url(#glow)">
  <animateMotion dur="11s" repeatCount="indefinite" path="M215 390a505 228 0 1 0 1010 0a505 228 0 1 0 -1010 0"/>
</circle>
<circle r="6" fill="#A855F7" filter="url(#glow)">
  <animateMotion dur="8s" repeatCount="indefinite" path="M330 390a390 175 0 1 0 780 0a390 175 0 1 0 -780 0"/>
</circle>
<circle r="5" fill="#60A5FA" filter="url(#glow)">
  <animateMotion dur="6s" repeatCount="indefinite" path="M435 390a285 128 0 1 0 570 0a285 128 0 1 0 -570 0"/>
</circle>
</svg>