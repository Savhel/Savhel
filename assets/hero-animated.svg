<svg width="1440" height="460" viewBox="0 0 1440 460" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="460">
    <stop offset="0%" stop-color="#030712"/>
    <stop offset="48%" stop-color="#081D3A"/>
    <stop offset="100%" stop-color="#3B0914"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="900" y2="0">
    <stop offset="0%" stop-color="#C8102E"/>
    <stop offset="48%" stop-color="#F5C542"/>
    <stop offset="100%" stop-color="#2563EB"/>
  </linearGradient>
  <radialGradient id="orbA" cx="0" cy="0" r="1" gradientTransform="translate(1170 100) rotate(90) scale(180)">
    <stop stop-color="#3B82F6" stop-opacity=".30"/>
    <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="orbB" cx="0" cy="0" r="1" gradientTransform="translate(1270 330) rotate(90) scale(220)">
    <stop stop-color="#C8102E" stop-opacity=".24"/>
    <stop offset="1" stop-color="#C8102E" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="1440" height="460" rx="34" fill="url(#bg)"/>
<rect x="1.5" y="1.5" width="1437" height="457" rx="32.5" stroke="#FFFFFF" stroke-opacity=".08"/>
<rect width="1440" height="460" rx="34" fill="url(#orbA)"/>
<rect width="1440" height="460" rx="34" fill="url(#orbB)"/>

<!-- animated ambient beams -->
<g opacity=".10">
  <rect x="-240" y="0" width="190" height="460" fill="url(#accent)" transform="skewX(-18)">
    <animate attributeName="x" values="-260;1520" dur="8s" repeatCount="indefinite"/>
  </rect>
  <rect x="-440" y="0" width="110" height="460" fill="url(#accent)" transform="skewX(-18)">
    <animate attributeName="x" values="-460;1500" dur="11s" repeatCount="indefinite"/>
  </rect>
</g>

<!-- neural/network constellation -->
<g stroke="#F5C542" stroke-opacity=".38" fill="none">
  <circle cx="1110" cy="86" r="18"/>
  <circle cx="1210" cy="70" r="13"/>
  <circle cx="1295" cy="118" r="15"/>
  <circle cx="1168" cy="168" r="16"/>
  <circle cx="1300" cy="220" r="12"/>
  <circle cx="1102" cy="248" r="14"/>
  <circle cx="1218" cy="300" r="11"/>
  <circle cx="1325" cy="328" r="10"/>
  <path d="M1128 83L1197 72"/>
  <path d="M1219 79L1282 112"/>
  <path d="M1120 102L1157 154"/>
  <path d="M1184 164L1286 126"/>
  <path d="M1182 178L1289 214"/>
  <path d="M1116 241L1206 295"/>
  <path d="M1116 243L1289 222"/>
  <path d="M1230 300L1315 326"/>
  <animate attributeName="stroke-opacity" values=".18;.42;.18" dur="5s" repeatCount="indefinite"/>
</g>

<!-- moving packets -->
<circle r="5" fill="#F5C542" filter="url(#glow)">
  <animateMotion dur="6s" repeatCount="indefinite" path="M1128 83L1197 72L1282 112L1286 214"/>
</circle>
<circle r="4" fill="#E31B36" filter="url(#glow)">
  <animateMotion dur="7.5s" repeatCount="indefinite" path="M1116 243L1206 295L1315 326"/>
</circle>

<g transform="translate(86 72)">
  <text x="0" y="30" fill="#F5C542" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2.5">
    SAVHEL // EMBEDDED AI + INTELLIGENT SYSTEMS
  </text>

  <text x="0" y="118" fill="white" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="72" font-weight="850">
    SAVIO TSAFACK
  </text>

  <rect x="0" y="143" width="870" height="7" rx="3.5" fill="url(#accent)" filter="url(#glow)">
    <animate attributeName="width" values="690;900;690" dur="7s" repeatCount="indefinite"/>
  </rect>

  <text x="0" y="205" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="700">
    Embedded • Intelligent • Virtualized Systems
  </text>

  <text x="0" y="250" fill="#BFD7FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25">
    AI • Machine Learning • Deep Learning • Distributed Infrastructure
  </text>

  <text x="0" y="302" fill="#D5B85A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
    sense → process → learn / reason → decide → act
  </text>

  <g transform="translate(0 340)">
    <rect x="0" y="0" width="190" height="38" rx="19" fill="#C8102E" fill-opacity=".18" stroke="#F04455" stroke-opacity=".78"/>
    <text x="95" y="24" text-anchor="middle" fill="#FFE4E6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">Embedded Systems</text>

    <rect x="205" y="0" width="190" height="38" rx="19" fill="#1E5AA8" fill-opacity=".20" stroke="#60A5FA" stroke-opacity=".78"/>
    <text x="300" y="24" text-anchor="middle" fill="#DBEAFE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">Expert Systems</text>

    <rect x="410" y="0" width="190" height="38" rx="19" fill="#6D28D9" fill-opacity=".20" stroke="#A78BFA" stroke-opacity=".78"/>
    <text x="505" y="24" text-anchor="middle" fill="#F3E8FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">AI &amp; Deep Learning</text>

    <rect x="615" y="0" width="190" height="38" rx="19" fill="#F5C542" fill-opacity=".16" stroke="#F7D774" stroke-opacity=".82"/>
    <text x="710" y="24" text-anchor="middle" fill="#FFF4C2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">Cloud &amp; Virtualization</text>
  </g>
</g>

<path d="M0 392C250 355 450 420 690 382C950 342 1160 332 1440 362V460H0V392Z" fill="#FFFFFF" fill-opacity=".028"/>
</svg>
