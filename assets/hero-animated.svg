<svg width="1440" height="460" viewBox="0 0 1440 460" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="460">
    <stop offset="0%" stop-color="#020617"/>
    <stop offset="45%" stop-color="#0A1633"/>
    <stop offset="100%" stop-color="#312E81"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="900" y2="0">
    <stop offset="0%" stop-color="#22D3EE"/>
    <stop offset="45%" stop-color="#3B82F6"/>
    <stop offset="100%" stop-color="#A855F7"/>
  </linearGradient>
  <radialGradient id="orbA" cx="0" cy="0" r="1" gradientTransform="translate(1170 100) rotate(90) scale(180)">
    <stop stop-color="#38BDF8" stop-opacity=".26"/>
    <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="orbB" cx="0" cy="0" r="1" gradientTransform="translate(1270 330) rotate(90) scale(220)">
    <stop stop-color="#A855F7" stop-opacity=".17"/>
    <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="1440" height="460" rx="34" fill="url(#bg)"/>
<rect x="1.5" y="1.5" width="1437" height="457" rx="32.5" stroke="#FFFFFF" stroke-opacity=".08"/>
<rect width="1440" height="460" rx="34" fill="url(#orbA)"/>
<rect width="1440" height="460" rx="34" fill="url(#orbB)"/>

<!-- animated ambient beams -->
<g opacity=".10">
  <rect x="-240" y="0" width="190" height="460" fill="url(#accent)" transform="skewX(-18)">
    <animate attributeName="x" values="-260;1520" dur="8s" repeatCount="indefinite"/>
  </rect>
  <rect x="-440" y="0" width="110" height="460" fill="url(#accent)" transform="skewX(-18)">
    <animate attributeName="x" values="-460;1500" dur="11s" repeatCount="indefinite"/>
  </rect>
</g>

<!-- neural/network constellation -->
<g stroke="#7DD3FC" stroke-opacity=".30" fill="none">
  <circle cx="1110" cy="86" r="18"/>
  <circle cx="1210" cy="70" r="13"/>
  <circle cx="1295" cy="118" r="15"/>
  <circle cx="1168" cy="168" r="16"/>
  <circle cx="1300" cy="220" r="12"/>
  <circle cx="1102" cy="248" r="14"/>
  <circle cx="1218" cy="300" r="11"/>
  <circle cx="1325" cy="328" r="10"/>
  <path d="M1128 83L1197 72"/>
  <path d="M1219 79L1282 112"/>
  <path d="M1120 102L1157 154"/>
  <path d="M1184 164L1286 126"/>
  <path d="M1182 178L1289 214"/>
  <path d="M1116 241L1206 295"/>
  <path d="M1116 243L1289 222"/>
  <path d="M1230 300L1315 326"/>
  <animate attributeName="stroke-opacity" values=".18;.42;.18" dur="5s" repeatCount="indefinite"/>
</g>

<!-- moving packets -->
<circle r="5" fill="#22D3EE" filter="url(#glow)">
  <animateMotion dur="6s" repeatCount="indefinite" path="M1128 83L1197 72L1282 112L1286 214"/>
</circle>
<circle r="4" fill="#A855F7" filter="url(#glow)">
  <animateMotion dur="7.5s" repeatCount="indefinite" path="M1116 243L1206 295L1315 326"/>
</circle>

<g transform="translate(86 72)">
  <text x="0" y="30" fill="#92A8D4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2.5">
    SAVHEL // SYSTEMS + INTELLIGENCE
  </text>

  <text x="0" y="118" fill="white" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="72" font-weight="850">
    SAVIO TSAFACK
  </text>

  <rect x="0" y="143" width="870" height="7" rx="3.5" fill="url(#accent)" filter="url(#glow)">
    <animate attributeName="width" values="690;900;690" dur="7s" repeatCount="indefinite"/>
  </rect>

  <text x="0" y="205" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="700">
    Distributed Systems • Systems Engineering • Intelligent Systems
  </text>

  <text x="0" y="250" fill="#C7D2FE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25">
    AI • Machine Learning • Deep Learning • XAI • Multi-Agent Systems
  </text>

  <text x="0" y="302" fill="#8EA7D4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
    observe → model → schedule → decide → act → adapt
  </text>

  <g transform="translate(0 340)">
    <rect x="0" y="0" width="190" height="38" rx="19" fill="#0EA5E9" fill-opacity=".15" stroke="#38BDF8" stroke-opacity=".62"/>
    <text x="95" y="24" text-anchor="middle" fill="#CFFAFE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">Distributed Computing</text>

    <rect x="205" y="0" width="190" height="38" rx="19" fill="#2563EB" fill-opacity=".15" stroke="#60A5FA" stroke-opacity=".62"/>
    <text x="300" y="24" text-anchor="middle" fill="#DBEAFE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">Intelligent Infrastructure</text>

    <rect x="410" y="0" width="142" height="38" rx="19" fill="#8B5CF6" fill-opacity=".15" stroke="#A78BFA" stroke-opacity=".62"/>
    <text x="481" y="24" text-anchor="middle" fill="#EDE9FE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">Radar + XAI</text>

    <rect x="567" y="0" width="132" height="38" rx="19" fill="#06B6D4" fill-opacity=".15" stroke="#67E8F9" stroke-opacity=".62"/>
    <text x="633" y="24" text-anchor="middle" fill="#CFFAFE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">GPUaaS</text>
  </g>
</g>

<path d="M0 392C250 355 450 420 690 382C950 342 1160 332 1440 362V460H0V392Z" fill="#FFFFFF" fill-opacity=".028"/>
</svg>