<svg width="1400" height="860" viewBox="0 0 1400 860" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="860">
    <stop stop-color="#0B1020"/>
    <stop offset="1" stop-color="#0F1A37"/>
  </linearGradient>
  <style>
    .card{fill:#0F172A;stroke:rgba(255,255,255,.10);}
    .head{fill:#fff;font-family:Inter,Segoe UI,Arial,sans-serif;font-size:26px;font-weight:800;}
    .sub{fill:#93C5FD;font-family:Inter,Segoe UI,Arial,sans-serif;font-size:17px;font-weight:600;}
    .body{fill:#CBD5E1;font-family:Inter,Segoe UI,Arial,sans-serif;font-size:15px;}
    .tag{fill:#111827;stroke:rgba(255,255,255,.10);}
    .tagt{fill:#E5E7EB;font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;font-weight:600;}
  </style>
</defs>
<rect width="1400" height="860" rx="28" fill="url(#bg)"/>
<text x="62" y="62" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800">Featured projects & research directions</text>
<text x="62" y="91" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">The most representative parts of my portfolio.</text>

<!-- Card 1 -->
<g>
  <rect x="60" y="130" width="600" height="290" rx="24" class="card"/>
  <rect x="60" y="130" width="600" height="8" rx="4" fill="#22D3EE">
    <animate attributeName="width" values="120;600;120" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="95" y="185" class="head">🛰️ Omega FusionCore / GANDAL</text>
  <text x="95" y="218" class="sub">Distributed resource management for virtualized datacenters</text>
  <text x="95" y="255" class="body">Remote memory paging • vCPU scheduling • migration • GPU placement • Ceph-backed clusters</text>
  <text x="95" y="282" class="body">A resource layer that aims to observe system pressure, decide a policy and adapt placement dynamically.</text>
  <g>
    <rect x="95" y="325" width="82" height="30" rx="15" class="tag"/><text x="136" y="344" text-anchor="middle" class="tagt">Proxmox</text>
    <rect x="186" y="325" width="62" height="30" rx="15" class="tag"/><text x="217" y="344" text-anchor="middle" class="tagt">Ceph</text>
    <rect x="257" y="325" width="66" height="30" rx="15" class="tag"/><text x="290" y="344" text-anchor="middle" class="tagt">Linux</text>
    <rect x="332" y="325" width="97" height="30" rx="15" class="tag"/><text x="381" y="344" text-anchor="middle" class="tagt">Distributed</text>
    <rect x="438" y="325" width="90" height="30" rx="15" class="tag"/><text x="483" y="344" text-anchor="middle" class="tagt">Scheduling</text>
    <rect x="537" y="325" width="84" height="30" rx="15" class="tag"/><text x="579" y="344" text-anchor="middle" class="tagt">GPUaaS</text>
  </g>
</g>

<!-- Card 2 -->
<g>
  <rect x="740" y="130" width="600" height="290" rx="24" class="card"/>
  <rect x="740" y="130" width="600" height="8" rx="4" fill="#3B82F6">
    <animate attributeName="width" values="180;600;180" dur="7s" repeatCount="indefinite"/>
  </rect>
  <text x="775" y="185" class="head">🌐 ProjetReseau</text>
  <text x="775" y="218" class="sub">Event-driven distributed services</text>
  <text x="775" y="255" class="body">Kafka • Cassandra • Redis • Prometheus • Spring Boot</text>
  <text x="775" y="282" class="body">A software view of distributed systems: asynchronous communication, state coordination and observability.</text>
  <g>
    <rect x="775" y="325" width="64" height="30" rx="15" class="tag"/><text x="807" y="344" text-anchor="middle" class="tagt">Kafka</text>
    <rect x="848" y="325" width="92" height="30" rx="15" class="tag"/><text x="894" y="344" text-anchor="middle" class="tagt">Cassandra</text>
    <rect x="949" y="325" width="62" height="30" rx="15" class="tag"/><text x="980" y="344" text-anchor="middle" class="tagt">Redis</text>
    <rect x="1020" y="325" width="101" height="30" rx="15" class="tag"/><text x="1071" y="344" text-anchor="middle" class="tagt">Prometheus</text>
    <rect x="1130" y="325" width="86" height="30" rx="15" class="tag"/><text x="1173" y="344" text-anchor="middle" class="tagt">Java 21</text>
  </g>
</g>

<!-- Card 3 -->
<g>
  <rect x="60" y="470" width="600" height="290" rx="24" class="card"/>
  <rect x="60" y="470" width="600" height="8" rx="4" fill="#8B5CF6">
    <animate attributeName="width" values="140;600;140" dur="9s" repeatCount="indefinite"/>
  </rect>
  <text x="95" y="525" class="head">📡 Radar + Signal AI + XAI</text>
  <text x="95" y="558" class="sub">Micro-Doppler intelligence & explainable classification</text>
  <text x="95" y="595" class="body">Doppler • Spectrograms • CNN / CNN-LSTM • SVM • XGBoost • SHAP • Grad-CAM</text>
  <text x="95" y="622" class="body">A research direction connecting signal processing, deep learning and physically grounded explainability.</text>
  <g>
    <rect x="95" y="665" width="72" height="30" rx="15" class="tag"/><text x="131" y="684" text-anchor="middle" class="tagt">Radar</text>
    <rect x="176" y="665" width="82" height="30" rx="15" class="tag"/><text x="217" y="684" text-anchor="middle" class="tagt">Signals</text>
    <rect x="267" y="665" width="58" height="30" rx="15" class="tag"/><text x="296" y="684" text-anchor="middle" class="tagt">CNN</text>
    <rect x="334" y="665" width="94" height="30" rx="15" class="tag"/><text x="381" y="684" text-anchor="middle" class="tagt">XGBoost</text>
    <rect x="437" y="665" width="65" height="30" rx="15" class="tag"/><text x="469" y="684" text-anchor="middle" class="tagt">SHAP</text>
    <rect x="511" y="665" width="92" height="30" rx="15" class="tag"/><text x="557" y="684" text-anchor="middle" class="tagt">Grad-CAM</text>
  </g>
</g>

<!-- Card 4 -->
<g>
  <rect x="740" y="470" width="600" height="290" rx="24" class="card"/>
  <rect x="740" y="470" width="600" height="8" rx="4" fill="#06B6D4">
    <animate attributeName="width" values="160;600;160" dur="6.5s" repeatCount="indefinite"/>
  </rect>
  <text x="775" y="525" class="head">🧤 Harmony Gloves / Intelligent Sensing</text>
  <text x="775" y="558" class="sub">Embedded sensing, filtering and smart interaction</text>
  <text x="775" y="595" class="body">ESP32 • IMU • Flex sensors • ESP-NOW • Kalman / EMA / filtering</text>
  <text x="775" y="622" class="body">Wearable sensing as a bridge between embedded systems, signal processing and intelligent recognition.</text>
  <g>
    <rect x="775" y="665" width="70" height="30" rx="15" class="tag"/><text x="810" y="684" text-anchor="middle" class="tagt">ESP32</text>
    <rect x="854" y="665" width="58" height="30" rx="15" class="tag"/><text x="883" y="684" text-anchor="middle" class="tagt">IMU</text>
    <rect x="921" y="665" width="76" height="30" rx="15" class="tag"/><text x="959" y="684" text-anchor="middle" class="tagt">Sensors</text>
    <rect x="1006" y="665" width="86" height="30" rx="15" class="tag"/><text x="1049" y="684" text-anchor="middle" class="tagt">ESP-NOW</text>
    <rect x="1101" y="665" width="67" height="30" rx="15" class="tag"/><text x="1134" y="684" text-anchor="middle" class="tagt">Kalman</text>
  </g>
</g>
</svg>