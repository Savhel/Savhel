<svg width="1400" height="420" viewBox="0 0 1400 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#030712">
        <animate attributeName="stop-color" values="#030712;#0B1022;#030712" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#0F1F4A">
        <animate attributeName="stop-color" values="#0F1F4A;#132D69;#0F1F4A" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#4338CA">
        <animate attributeName="stop-color" values="#4338CA;#2563EB;#4338CA" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#A855F7"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-200 0;200 0;-200 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="orb1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1150 85) rotate(90) scale(150 150)">
      <stop stop-color="#60A5FA" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1260 295) rotate(90) scale(230 230)">
      <stop stop-color="#A855F7" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1400" height="420" rx="30" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1397" height="417" rx="28.5" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <rect width="1400" height="420" rx="30" fill="url(#orb1)"/>
  <rect width="1400" height="420" rx="30" fill="url(#orb2)"/>

  <!-- moving top grid -->
  <g opacity="0.12">
    <path d="M0 70H1400" stroke="#93C5FD"/>
    <path d="M0 120H1400" stroke="#93C5FD"/>
    <path d="M0 170H1400" stroke="#93C5FD"/>
    <path d="M0 220H1400" stroke="#93C5FD"/>
    <path d="M0 270H1400" stroke="#93C5FD"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="7s" repeatCount="indefinite"/>
  </g>

  <!-- network -->
  <g opacity="0.26" stroke="#7DD3FC" stroke-width="1.5">
    <circle cx="1080" cy="92" r="18"/>
    <circle cx="1198" cy="62" r="14"/>
    <circle cx="1274" cy="125" r="11"/>
    <circle cx="1154" cy="166" r="16"/>
    <circle cx="1280" cy="228" r="13"/>
    <circle cx="1108" cy="240" r="12"/>
    <circle cx="1210" cy="296" r="10"/>
    <path d="M1097 88L1184 66"/>
    <path d="M1088 107L1143 155"/>
    <path d="M1168 160L1268 130"/>
    <path d="M1164 177L1270 222"/>
    <path d="M1119 235L1201 291"/>
    <path d="M1120 230L1266 226"/>
    <path d="M1206 76L1267 119"/>
    <animate attributeName="opacity" values="0.18;0.34;0.18" dur="5s" repeatCount="indefinite"/>
  </g>

  <!-- scan line -->
  <rect x="-300" y="0" width="240" height="420" fill="url(#accent)" opacity="0.08" transform="skewX(-20)">
    <animate attributeName="x" values="-320;1500" dur="7s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(82 72)">
    <text x="0" y="28" fill="#9FB2D8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2">SAVHEL // COMPUTING SYSTEMS + INTELLIGENCE</text>

    <text x="0" y="112" fill="white" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="68" font-weight="800">SAVIO TSAFACK</text>

    <rect x="0" y="136" width="810" height="6" rx="3" fill="url(#accent)" filter="url(#glow)">
      <animate attributeName="width" values="680;830;680" dur="6s" repeatCount="indefinite"/>
    </rect>

    <text x="0" y="192" fill="#E2E8F0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="29" font-weight="650">
      Distributed Systems • Systems Engineering • Intelligent Systems
    </text>

    <text x="0" y="236" fill="#C7D2FE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24">
      AI • Machine Learning • Deep Learning • XAI • Multi-Agent Systems
    </text>

    <text x="0" y="283" fill="#8FA8D8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
      observe → model → schedule → decide → act → adapt
    </text>

    <g transform="translate(0 316)">
      <rect x="0" y="0" width="170" height="34" rx="17" fill="#0EA5E9" fill-opacity="0.16" stroke="#38BDF8" stroke-opacity="0.6"/>
      <text x="85" y="22" text-anchor="middle" fill="#CFFAFE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">GPUaaS & Intelligent Infra</text>

      <rect x="186" y="0" width="134" height="34" rx="17" fill="#8B5CF6" fill-opacity="0.16" stroke="#A78BFA" stroke-opacity="0.65"/>
      <text x="253" y="22" text-anchor="middle" fill="#E9D5FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Radar + XAI</text>

      <rect x="336" y="0" width="196" height="34" rx="17" fill="#2563EB" fill-opacity="0.16" stroke="#60A5FA" stroke-opacity="0.65"/>
      <text x="434" y="22" text-anchor="middle" fill="#DBEAFE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Cloud / Virtualization / Ceph</text>
    </g>
  </g>

  <path d="M0 356C238 322 447 387 670 352C932 311 1137 301 1400 330V420H0V356Z" fill="#FFFFFF" fill-opacity="0.03"/>
</svg>