<svg width="1400" height="680" viewBox="0 0 1400 680" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="g1" x1="0" y1="0" x2="1400" y2="680">
    <stop stop-color="#0B1020"/>
    <stop offset="1" stop-color="#111D42"/>
  </linearGradient>
  <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#22D3EE"/>
    <stop offset="1" stop-color="#8B5CF6"/>
  </linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/></filter>
  <style>
    .card { fill:#0F172A; stroke:rgba(255,255,255,.10); }
    .title { fill:white; font-family:Inter,Segoe UI,Arial,sans-serif; font-weight:700; font-size:24px; }
    .body { fill:#C7D2FE; font-family:Inter,Segoe UI,Arial,sans-serif; font-size:16px; }
    .small { fill:#94A3B8; font-family:Inter,Segoe UI,Arial,sans-serif; font-size:14px; }
    .coret { fill:white; font-family:Inter,Segoe UI,Arial,sans-serif; font-weight:800; font-size:28px; }
    .line { stroke:#60A5FA; stroke-opacity:.42; stroke-width:2; stroke-dasharray:8 8; }
  </style>
</defs>
<rect width="1400" height="680" rx="26" fill="url(#g1)"/>
<text x="70" y="58" fill="#E5E7EB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800">My Engineering Universe</text>
<text x="70" y="88" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">The domains I connect in my work and research.</text>

<!-- core -->
<g filter="url(#shadow)">
  <rect x="520" y="250" width="360" height="170" rx="30" fill="url(#core)"/>
</g>
<text x="700" y="315" text-anchor="middle" class="coret">INTELLIGENT</text>
<text x="700" y="350" text-anchor="middle" class="coret">COMPUTING</text>
<text x="700" y="385" text-anchor="middle" class="coret">SYSTEMS</text>

<!-- lines -->
<path class="line" d="M520 315C435 315 400 205 324 174"/>
<path class="line" d="M608 250C600 180 475 120 370 120"/>
<path class="line" d="M790 250C820 195 920 135 1035 120"/>
<path class="line" d="M880 315C980 315 1055 205 1078 175"/>
<path class="line" d="M575 420C535 500 465 555 364 563"/>
<path class="line" d="M700 420C700 510 700 548 700 565"/>
<path class="line" d="M828 420C880 500 968 560 1036 563"/>
<path class="line" d="M1078 175C1095 148 1115 128 1132 120"/>

<!-- animated packets -->
<circle r="5" fill="#93C5FD">
  <animateMotion dur="6s" repeatCount="indefinite" path="M520 315C435 315 400 205 324 174"/>
</circle>
<circle r="5" fill="#A78BFA">
  <animateMotion dur="5s" repeatCount="indefinite" path="M700 420C700 510 700 548 700 565"/>
</circle>
<circle r="5" fill="#22D3EE">
  <animateMotion dur="7s" repeatCount="indefinite" path="M790 250C820 195 920 135 1035 120"/>
</circle>
<circle r="5" fill="#60A5FA">
  <animateMotion dur="6.5s" repeatCount="indefinite" path="M828 420C880 500 968 560 1036 563"/>
</circle>

<!-- cards -->
<g filter="url(#shadow)">
  <rect x="160" y="115" width="250" height="118" rx="22" class="card"/>
  <rect x="245" y="60" width="80" height="80" rx="20" fill="#0EA5E9" fill-opacity=".18" stroke="#38BDF8" stroke-opacity=".65"/>
  <text x="285" y="108" text-anchor="middle" fill="#7DD3FC" font-size="30">🌐</text>
  <text x="185" y="163" class="title">Distributed Systems</text>
  <text x="185" y="192" class="body">Kafka • Cassandra • Redis</text>
  <text x="185" y="214" class="small">Event-driven workflows & resource distribution</text>
</g>

<g filter="url(#shadow)">
  <rect x="980" y="115" width="260" height="118" rx="22" class="card"/>
  <rect x="1068" y="60" width="84" height="80" rx="20" fill="#2563EB" fill-opacity=".18" stroke="#60A5FA" stroke-opacity=".65"/>
  <text x="1110" y="108" text-anchor="middle" fill="#93C5FD" font-size="30">☁️</text>
  <text x="1005" y="163" class="title">Cloud & Virtualization</text>
  <text x="1005" y="192" class="body">Proxmox • XCP-ng • Ceph</text>
  <text x="1005" y="214" class="small">Clusters, migration, storage and orchestration</text>
</g>

<g filter="url(#shadow)">
  <rect x="1055" y="170" width="260" height="118" rx="22" class="card" opacity="0">
    <animate attributeName="opacity" values="0;1;1" dur="1ms" begin="0s" fill="freeze"/>
  </rect>
</g>

<g filter="url(#shadow)">
  <rect x="1060" y="170" width="245" height="118" rx="22" class="card"/>
  <rect x="1142" y="115" width="80" height="80" rx="20" fill="#A855F7" fill-opacity=".18" stroke="#C084FC" stroke-opacity=".65"/>
  <text x="1182" y="163" text-anchor="middle" fill="#E9D5FF" font-size="30">🧠</text>
  <text x="1083" y="219" class="title">AI / ML / DL</text>
  <text x="1083" y="248" class="body">Learning • Prediction • XAI</text>
  <text x="1083" y="270" class="small">From signal intelligence to adaptive systems</text>
</g>

<g filter="url(#shadow)">
  <rect x="150" y="505" width="265" height="118" rx="22" class="card"/>
  <rect x="240" y="450" width="82" height="80" rx="20" fill="#0EA5E9" fill-opacity=".18" stroke="#67E8F9" stroke-opacity=".65"/>
  <text x="281" y="498" text-anchor="middle" fill="#A5F3FC" font-size="30">📟</text>
  <text x="175" y="553" class="title">IoT & Sensing</text>
  <text x="175" y="582" class="body">ESP32 • IMU • Sensors</text>
  <text x="175" y="604" class="small">Wearables, filtering and intelligent interfaces</text>
</g>

<g filter="url(#shadow)">
  <rect x="560" y="515" width="280" height="118" rx="22" class="card"/>
  <rect x="655" y="460" width="90" height="80" rx="20" fill="#7C3AED" fill-opacity=".18" stroke="#A78BFA" stroke-opacity=".65"/>
  <text x="700" y="508" text-anchor="middle" fill="#DDD6FE" font-size="30">⚙️</text>
  <text x="585" y="563" class="title">Operating Systems</text>
  <text x="585" y="592" class="body">Scheduling • Concurrency • Memory</text>
  <text x="585" y="614" class="small">Processes, syscalls, synchronization and control</text>
</g>

<g filter="url(#shadow)">
  <rect x="985" y="505" width="290" height="118" rx="22" class="card"/>
  <rect x="1087" y="450" width="86" height="80" rx="20" fill="#1D4ED8" fill-opacity=".18" stroke="#60A5FA" stroke-opacity=".65"/>
  <text x="1130" y="498" text-anchor="middle" fill="#BFDBFE" font-size="30">📡</text>
  <text x="1010" y="553" class="title">Signal & Radar AI</text>
  <text x="1010" y="582" class="body">Micro-Doppler • Spectrograms • XAI</text>
  <text x="1010" y="604" class="small">Classification, physical interpretation and validation</text>
</g>
</svg>